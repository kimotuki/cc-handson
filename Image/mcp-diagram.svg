<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78716c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="818" height="368" fill="#f5f3ee"/>

  <!-- Claude Code -->
  <rect x="30" y="115" width="190" height="130" rx="14" fill="#fbf3ec" stroke="#d97757" stroke-width="2"/>
  <text x="125" y="168" font-size="16" font-weight="700" fill="#a84e32" text-anchor="middle">Claude Code</text>
  <text x="125" y="192" font-size="10.5" fill="#78716c" text-anchor="middle">ツールを使って作業する</text>

  <!-- 接続 -->
  <line x1="226" y1="180" x2="324" y2="180" stroke="#78716c" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="275" y="166" font-size="9.5" fill="#78716c" text-anchor="middle">ツール呼び出し / 結果</text>

  <!-- MCP -->
  <rect x="330" y="95" width="150" height="170" rx="12" fill="#f0c9b4" stroke="#a84e32" stroke-width="2"/>
  <text x="405" y="155" font-size="17" font-weight="700" fill="#292524" text-anchor="middle">MCP</text>
  <text x="405" y="177" font-size="9.5" fill="#78716c" text-anchor="middle">Model Context Protocol</text>
  <text x="405" y="197" font-size="10" fill="#78716c" text-anchor="middle">外部接続の共通規格</text>

  <!-- ファン接続 -->
  <line x1="480" y1="150" x2="584" y2="89" stroke="#78716c" stroke-width="1.4"/>
  <line x1="480" y1="170" x2="584" y2="155" stroke="#78716c" stroke-width="1.4"/>
  <line x1="480" y1="190" x2="584" y2="221" stroke="#78716c" stroke-width="1.4"/>
  <line x1="480" y1="210" x2="584" y2="287" stroke="#78716c" stroke-width="1.4"/>

  <!-- 外部サービス -->
  <text x="685" y="44" font-size="11" font-weight="700" fill="#a84e32" text-anchor="middle">外部サービス（MCP サーバー）</text>

  <rect x="590" y="62" width="190" height="54" rx="9" fill="#f7e4d8" stroke="#d97757" stroke-width="1"/>
  <text x="685" y="85" font-size="12.5" font-weight="600" fill="#292524" text-anchor="middle">GitHub</text>
  <text x="685" y="103" font-size="9.5" fill="#78716c" text-anchor="middle">Issue・PR の操作</text>

  <rect x="590" y="128" width="190" height="54" rx="9" fill="#f7e4d8" stroke="#d97757" stroke-width="1"/>
  <text x="685" y="151" font-size="12.5" font-weight="600" fill="#292524" text-anchor="middle">Slack</text>
  <text x="685" y="169" font-size="9.5" fill="#78716c" text-anchor="middle">メッセージの送受信</text>

  <rect x="590" y="194" width="190" height="54" rx="9" fill="#f7e4d8" stroke="#d97757" stroke-width="1"/>
  <text x="685" y="217" font-size="12.5" font-weight="600" fill="#292524" text-anchor="middle">Figma</text>
  <text x="685" y="235" font-size="9.5" fill="#78716c" text-anchor="middle">デザインの読み取り</text>

  <rect x="590" y="260" width="190" height="54" rx="9" fill="#f7e4d8" stroke="#d97757" stroke-width="1"/>
  <text x="685" y="283" font-size="12.5" font-weight="600" fill="#292524" text-anchor="middle">データベース</text>
  <text x="685" y="301" font-size="9.5" fill="#78716c" text-anchor="middle">クエリの実行</text>

  <text x="410" y="352" font-size="11.5" fill="#78716c" text-anchor="middle">接続すると、外部サービスの操作が「ツール」として Claude から使えるようになる</text>
</svg>
