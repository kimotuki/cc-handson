<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 340" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78716c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="908" height="338" fill="#f5f3ee"/>

  <text x="20" y="26" font-size="14" font-weight="700" fill="#a84e32">MCP（Model Context Protocol）— 外部サービスを接続する標準規格</text>

  <!-- Claude Code -->
  <rect x="30" y="128" width="200" height="90" rx="10" fill="#f7e4d8" stroke="#d97757" stroke-width="1.5"/>
  <text x="130" y="168" font-size="14" font-weight="700" fill="#292524" text-anchor="middle">Claude Code</text>
  <text x="130" y="192" font-size="10.5" fill="#78716c" text-anchor="middle">接続先のツールを呼び出す</text>

  <!-- MCP プロトコル -->
  <rect x="310" y="143" width="130" height="60" rx="10" fill="#ffffff" stroke="#d97757" stroke-width="1.5"/>
  <text x="375" y="168" font-size="13.5" font-weight="700" fill="#292524" text-anchor="middle">MCP</text>
  <text x="375" y="188" font-size="10.5" fill="#78716c" text-anchor="middle">標準プロトコル</text>

  <!-- 接続線 -->
  <line x1="230" y1="173" x2="308" y2="173" stroke="#78716c" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M 440 173 H 520 V 68 H 598" fill="none" stroke="#78716c" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M 440 173 H 520 V 138 H 598" fill="none" stroke="#78716c" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M 440 173 H 520 V 208 H 598" fill="none" stroke="#78716c" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M 440 173 H 520 V 278 H 598" fill="none" stroke="#78716c" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- MCP サーバー -->
  <rect x="600" y="40" width="280" height="56" rx="10" fill="#ffffff" stroke="#d97757" stroke-width="1.5"/>
  <text x="740" y="63" font-size="12.5" font-weight="700" fill="#292524" text-anchor="middle">GitHub MCP</text>
  <text x="740" y="83" font-size="10.5" fill="#78716c" text-anchor="middle">ツール例: Issue・PR の操作</text>

  <rect x="600" y="110" width="280" height="56" rx="10" fill="#ffffff" stroke="#d97757" stroke-width="1.5"/>
  <text x="740" y="133" font-size="12.5" font-weight="700" fill="#292524" text-anchor="middle">Slack MCP</text>
  <text x="740" y="153" font-size="10.5" fill="#78716c" text-anchor="middle">ツール例: メッセージの送信・検索</text>

  <rect x="600" y="180" width="280" height="56" rx="10" fill="#ffffff" stroke="#d97757" stroke-width="1.5"/>
  <text x="740" y="203" font-size="12.5" font-weight="700" fill="#292524" text-anchor="middle">Figma MCP</text>
  <text x="740" y="223" font-size="10.5" fill="#78716c" text-anchor="middle">ツール例: デザインデータの読み取り</text>

  <rect x="600" y="250" width="280" height="56" rx="10" fill="#ffffff" stroke="#d97757" stroke-width="1.5"/>
  <text x="740" y="273" font-size="12.5" font-weight="700" fill="#292524" text-anchor="middle">DB MCP</text>
  <text x="740" y="293" font-size="10.5" fill="#78716c" text-anchor="middle">ツール例: スキーマ参照・クエリ実行</text>

  <!-- 注記 -->
  <text x="455" y="328" font-size="11.5" fill="#78716c" text-anchor="middle">接続すると、外部サービスの操作が「ツール」として Claude から使えるようになる</text>
</svg>
