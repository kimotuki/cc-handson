<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 310" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78716c"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="908" height="308" fill="#f5f3ee"/>

  <text x="20" y="26" font-size="14" font-weight="700" fill="#a84e32">git worktree — 1つのリポジトリ、複数の作業ディレクトリ</text>

  <!-- メインの作業ディレクトリ -->
  <rect x="30" y="105" width="250" height="100" rx="10" fill="#f7e4d8" stroke="#d97757" stroke-width="1.5"/>
  <text x="155" y="133" font-size="13.5" font-weight="700" fill="#292524" text-anchor="middle">メインの作業ディレクトリ</text>
  <text x="155" y="156" font-size="11" fill="#78716c" text-anchor="middle">laravel-chat-app/（ブランチ: main）</text>
  <text x="155" y="174" font-size="11" fill="#78716c" text-anchor="middle">.git 本体（履歴・オブジェクト）</text>
  <text x="155" y="192" font-size="11" fill="#78716c" text-anchor="middle">自分はここで作業を続けられる</text>

  <!-- worktree 1 -->
  <rect x="560" y="50" width="320" height="90" rx="10" fill="#ffffff" stroke="#d97757" stroke-width="1.5"/>
  <text x="720" y="78" font-size="13.5" font-weight="700" fill="#292524" text-anchor="middle">worktree ①（Terminal 1）</text>
  <text x="720" y="101" font-size="11" fill="#78716c" text-anchor="middle">別ディレクトリ ＋ ブランチ feature-a</text>
  <text x="720" y="119" font-size="11" fill="#78716c" text-anchor="middle">claude --worktree feature-a</text>

  <!-- worktree 2 -->
  <rect x="560" y="170" width="320" height="90" rx="10" fill="#ffffff" stroke="#d97757" stroke-width="1.5"/>
  <text x="720" y="198" font-size="13.5" font-weight="700" fill="#292524" text-anchor="middle">worktree ②（Terminal 2）</text>
  <text x="720" y="221" font-size="11" fill="#78716c" text-anchor="middle">別ディレクトリ ＋ ブランチ bugfix-123</text>
  <text x="720" y="239" font-size="11" fill="#78716c" text-anchor="middle">claude --worktree bugfix-123</text>

  <!-- 矢印 -->
  <path d="M 280 155 H 420 V 95 H 558" fill="none" stroke="#78716c" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M 280 155 H 420 V 215 H 558" fill="none" stroke="#78716c" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="350" y="147" font-size="11" fill="#78716c" text-anchor="middle">claude --worktree で自動作成</text>

  <!-- 注記 -->
  <text x="455" y="292" font-size="11.5" fill="#78716c" text-anchor="middle">.git（履歴）は共有 — 作業ディレクトリとブランチはそれぞれ独立なので、変更が衝突しない</text>
</svg>
