<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78716c"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a84e32"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="898" height="498" fill="#f5f3ee"/>
  <text x="450" y="38" font-size="18" font-weight="700" fill="#292524" text-anchor="middle">MCP（Model Context Protocol）の構成</text>

  <!-- ===== AI ホスト ===== -->
  <rect x="60" y="120" width="210" height="190" rx="12" fill="#ffffff" stroke="#d97757" stroke-width="2"/>
  <text x="165" y="150" font-size="15" font-weight="700" fill="#a84e32" text-anchor="middle">AI ホスト</text>
  <text x="165" y="170" font-size="10.5" fill="#78716c" text-anchor="middle">（Claude Code・Claude.ai・IDE など）</text>

  <circle cx="115" cy="212" r="22" fill="#fbf3ec" stroke="#d97757" stroke-width="1.5"/>
  <text x="115" y="216" font-size="11" font-weight="700" fill="#292524" text-anchor="middle">モデル</text>
  <path d="M 140 226 Q 152 240 150 250" fill="none" stroke="#78716c" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <text x="132" y="248" font-size="9.5" fill="#78716c" text-anchor="end">利用</text>

  <rect x="90" y="252" width="150" height="40" rx="8" fill="#f0c9b4" stroke="#a84e32" stroke-width="1.5"/>
  <text x="165" y="277" font-size="13" font-weight="700" fill="#292524" text-anchor="middle">MCP クライアント</text>

  <!-- ===== MCP サーバー ===== -->
  <rect x="345" y="120" width="210" height="190" rx="12" fill="#ffffff" stroke="#d97757" stroke-width="2"/>
  <text x="450" y="150" font-size="15" font-weight="700" fill="#a84e32" text-anchor="middle">MCP サーバー</text>
  <text x="450" y="170" font-size="10.5" fill="#78716c" text-anchor="middle">（データソースへのアダプタ）</text>

  <rect x="395" y="196" width="110" height="80" rx="8" fill="#fbf3ec" stroke="#d97757" stroke-width="1.5"/>
  <line x1="395" y1="214" x2="505" y2="214" stroke="#d97757" stroke-width="1.5"/>
  <circle cx="496" cy="205" r="3" fill="#16a34a"/>
  <text x="450" y="250" font-size="11" font-weight="700" fill="#a84e32" text-anchor="middle">SERVER</text>
  <text x="450" y="298" font-size="9.5" fill="#78716c" text-anchor="middle">ツールを定義し、要求を実行する</text>

  <!-- ===== データソース ===== -->
  <rect x="630" y="120" width="210" height="190" rx="12" fill="#ffffff" stroke="#d97757" stroke-width="2"/>
  <text x="735" y="150" font-size="15" font-weight="700" fill="#a84e32" text-anchor="middle">データソース</text>
  <text x="735" y="170" font-size="10.5" fill="#78716c" text-anchor="middle">（ファイル・データベース・API）</text>

  <rect x="668" y="196" width="56" height="76" rx="6" fill="#fbf3ec" stroke="#d97757" stroke-width="1.5"/>
  <rect x="676" y="206" width="40" height="12" rx="2" fill="#f0c9b4"/>
  <rect x="676" y="224" width="40" height="12" rx="2" fill="#f0c9b4"/>
  <rect x="676" y="242" width="40" height="12" rx="2" fill="#f0c9b4"/>
  <text x="696" y="292" font-size="10" fill="#78716c" text-anchor="middle">データベース</text>

  <path d="M 748 196 H 790 L 802 208 V 272 H 748 Z" fill="#fbf3ec" stroke="#d97757" stroke-width="1.5"/>
  <path d="M 790 196 V 208 H 802" fill="none" stroke="#d97757" stroke-width="1.5"/>
  <text x="775" y="240" font-size="11" font-weight="700" fill="#a84e32" text-anchor="middle">DOC</text>
  <text x="775" y="292" font-size="10" fill="#78716c" text-anchor="middle">ファイル / API</text>

  <!-- ===== ホスト ⇄ サーバー ===== -->
  <line x1="272" y1="200" x2="342" y2="200" stroke="#a84e32" stroke-width="2.2" marker-end="url(#arrow-accent)"/>
  <rect x="262" y="172" width="90" height="20" rx="4" fill="#ffffff" stroke="#e4dfd5"/>
  <text x="307" y="186" font-size="10" font-weight="700" fill="#a84e32" text-anchor="middle">MCP で要求</text>
  <text x="307" y="220" font-size="9" fill="#78716c" text-anchor="middle" font-style="italic">「report.pdf を読んで」</text>

  <line x1="342" y1="262" x2="272" y2="262" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="262" y="270" width="90" height="20" rx="4" fill="#ffffff" stroke="#e4dfd5"/>
  <text x="307" y="284" font-size="10" font-weight="700" fill="#16a34a" text-anchor="middle">MCP で応答</text>

  <!-- ===== サーバー ⇄ データソース ===== -->
  <line x1="557" y1="200" x2="627" y2="200" stroke="#a84e32" stroke-width="2.2" marker-end="url(#arrow-accent)"/>
  <rect x="547" y="172" width="90" height="20" rx="4" fill="#ffffff" stroke="#e4dfd5"/>
  <text x="592" y="186" font-size="10" font-weight="700" fill="#a84e32" text-anchor="middle">取得 / 実行</text>

  <line x1="627" y1="262" x2="557" y2="262" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="547" y="270" width="90" height="20" rx="4" fill="#ffffff" stroke="#e4dfd5"/>
  <text x="592" y="284" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">データを返す</text>

  <!-- ===== フロー説明 ===== -->
  <rect x="150" y="360" width="600" height="96" rx="10" fill="#fbf3ec" stroke="#e4dfd5" stroke-width="1.5"/>
  <text x="450" y="388" font-size="13" font-weight="700" fill="#292524" text-anchor="middle">MCP の流れ</text>
  <text x="450" y="412" font-size="11" fill="#78716c" text-anchor="middle">ホスト側の MCP クライアントが、モデルの要求を標準化された形式に変換して MCP サーバーへ送り、</text>
  <text x="450" y="432" font-size="11" fill="#78716c" text-anchor="middle">MCP サーバーが外部のデータソースにアクセスして結果を返す。ホストはサーバーの中身を知らなくてよい。</text>
</svg>
